# The Gradle daemon is given enough room for the Rust build that runs beside it. The Kotlin
# compiler is told to use the same heap, because the two do not run at the same time and a
# second, larger allocation would only be held idle.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
