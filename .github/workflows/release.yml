name: Release

# Releases only on `v*` tags.
#
# Deliberately **not** on pushes to main: the CI workflow already builds and tests every push,
# and a Release is a public statement about a commit. It is made on purpose rather than as a
# side effect of merging.
#
# The tag carries the application version, and the first job checks that the two agree before
# anything is built: a Release whose tag says one thing while the APK inside says another is
# worse than no Release, because the version is what a user reports in a bug.
on:
  push:
    tags:
      - 'v*'
  # A manual run only verifies the tag against the version; it never creates a Release.
  workflow_dispatch:

jobs:
  verify:
    name: verify the tag matches versionName
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with versionName
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

  android:
    name: assemble the release APK
    needs: verify
    # A manual trigger only runs verification: nothing is released without a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `GITHUB_TOKEN` is read-only by default, and the last steps write to a Release. The
    # minimum permission is declared explicitly: writing repository contents, and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/*.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install the Rust tools
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --locked

      # The keystore itself arrives as base64 so that it is one secret rather than a file in
      # the repository. `keystore.properties` is the same file a developer writes locally.
      #
      # Without the secrets the build still produces an installable APK, signed with the
      # Android debug key; that is not an identity to publish under, so the job says so out
      # loud and the verification step below refuses to call it a release.
      - name: Check whether the signing key is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with the debug key and is not a release. See docs/BUILDING.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the signing configuration
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A here-document's terminator is only recognised at the start of a line, and the
          # body of a workflow is indented: writing the file with a here-document waits for an
          # end that never arrives. Separate lines into a redirect cannot be misread.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - uses: gradle/actions/setup-gradle@v4

      # A failure prints its own last lines as `::error::` annotations: reading a run's log
      # needs the API (rate-limited) or a download, while annotations are on the run page.
      - name: Assemble the release APK
        run: |
          set +e
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::the release APK build failed"
            grep -n -m 40 -E "What went wrong|Execution failed for task|Caused by:|^e: |error\[|error: " gradle.log \
              | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 25 gradle.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      # A build that quietly fell back to the debug keystore is not a release: the APK installs
      # and runs, so nothing else in the pipeline would notice.
      - name: Verify the APK is signed by the release key
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi

      - name: Name the APK after the tag
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
             "QualiaMinigames-${GITHUB_REF_NAME}.apk"
          # The notes tell a reader to check the digest against a file beside the APK, so the
          # file has to exist and has to be written from the same bytes that are uploaded.
          sha256sum "QualiaMinigames-${GITHUB_REF_NAME}.apk" \
            | awk '{print $1}' > "QualiaMinigames-${GITHUB_REF_NAME}.apk.sha256"
          cat "QualiaMinigames-${GITHUB_REF_NAME}.apk.sha256"

      - name: Create the Release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the Release already exists"
            exit 0
          fi
          # The body lives in `RELEASE_NOTES.md`, so the wording can change without touching
          # this workflow. The token in it becomes the tag, which is what the file name in
          # the notes is built from.
          sed "s/@VERSION@/${GITHUB_REF_NAME}/g" RELEASE_NOTES.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "QualiaMinigames ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

      - name: Upload the APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(
            "QualiaMinigames-${GITHUB_REF_NAME}.apk"
            "QualiaMinigames-${GITHUB_REF_NAME}.apk.sha256"
          )
          if gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber; then
            echo "Uploaded the APK to $GITHUB_REF_NAME"
          else
            echo "::warning::the APK was built, but uploading it to the Release failed (usually a missing contents: write permission)."
          fi
