name: CI

# The interface is built and tested here, and so is the Rust library it draws: the unit tests
# call the real rules across the FFI rather than a mock, which is the only way a binding that
# compiles but answers wrongly is caught before a device does.
#
# The two Rust repositories are checked out beside this one and the build is pointed at them.
# That is what a developer does locally while the crates are unpublished, and it is what makes
# this pipeline depend on the code rather than on a release having happened first. Once
# `qualia-minigames-ffi` is on crates.io the checkouts can go and the build properties with
# them; see docs/BUILDING.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The siblings go one level up, which is where the build's properties point: `../FFI`
      # and `../Core`, the same shape as a local workspace.
      - uses: actions/checkout@v4
        with:
          repository: QualiaMinigames/QualiaMinigames-Core
          path: ../Core

      - uses: actions/checkout@v4
        with:
          repository: QualiaMinigames/QualiaMinigames-FFI
          path: ../FFI

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK
        # The runner image carries the SDK and ANDROID_HOME, but not necessarily the NDK
        # release the build pins.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ../FFI/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install the Rust tools
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain -Pqualia.minigames.ffi.localDir=../FFI -Pqualia.minigames.core.localDir=../Core

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --console=plain -Pqualia.minigames.ffi.localDir=../FFI -Pqualia.minigames.core.localDir=../Core

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qualia-minigames-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: assemble release
    # A release build needs the keystore, which only exists for a push to main; a pull request
    # from a fork cannot have it and must not be the thing that fails.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: QualiaMinigames/QualiaMinigames-Core
          path: ../Core

      - uses: actions/checkout@v4
        with:
          repository: QualiaMinigames/QualiaMinigames-FFI
          path: ../FFI

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install the Rust tools
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --locked

      - name: Check whether the signing key is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so no release APK is built. See docs/BUILDING.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The keystore itself arrives as base64 so that it is one secret rather than a file in
      # the repository. `keystore.properties` is the same file a developer writes locally.
      - name: Write the signing configuration
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the release APK
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew :app:assembleRelease --console=plain -Pqualia.minigames.ffi.localDir=../FFI -Pqualia.minigames.core.localDir=../Core

      # A build that quietly fell back to the debug key is not a release. The check is here
      # rather than inside the build because the build has to work without a keystore too.
      - name: Verify the release APK is signed by the release key
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi

      - name: Upload the release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qualia-minigames-release
          path: app/build/outputs/apk/release/app-release.apk
          # Absent only when the signing key is, which the step above already reported.
          if-no-files-found: warn
