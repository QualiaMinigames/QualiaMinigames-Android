name: CI

# The interface is built and tested here, and so is the Rust library it draws: the unit tests
# call the real rules across the FFI rather than a mock, which is the only way a binding that
# compiles but answers wrongly is caught before a device does.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK
        # The GitHub runner image carries the SDK and ANDROID_HOME, but not necessarily the
        # NDK release the build pins.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/*.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install the Rust tools
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --locked

      - uses: gradle/actions/setup-gradle@v4

      # The FFI is taken from crates.io at the version the build asks for, which is what a
      # release build does. A change to the FFI is tested by publishing it first, or locally
      # with `-Pqualia.minigames.ffi.localDir`.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qualia-minigames-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: assemble release
    # A release build needs the keystore, which only exists for a push to main; a pull request
    # from a fork cannot have it and must not be the thing that fails.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install the Rust tools
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --locked

      # The keystore itself arrives as base64 so that it is one secret rather than a file in
      # the repository. `keystore.properties` is the same file a developer writes locally.
      - name: Write the signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release build would be signed with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: qualia-minigames-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
